name: Android debug build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 检测工程
        id: detect
        run: |
          if [ -f gradlew ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库里还没有 gradlew，跳过构建（等 mvp/scaffold 合入后自动生效）。"
          fi

      - name: 安装 JDK 17
        if: steps.detect.outputs.has_project == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        if: steps.detect.outputs.has_project == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 debug APK
        if: steps.detect.outputs.has_project == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 编译 W3 仪器测试（只编译不运行）
        if: steps.detect.outputs.has_project == 'true'
        run: ./gradlew --no-daemon --stacktrace :core:workspace:assembleDebugAndroidTest :feature:files:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      # ---- r3（DESIGN-r3 §8.4，D3 授权）：全部模块单测 + 全部仪器测试编译 ----
      - name: 单元测试（全部模块，r3）
        if: steps.detect.outputs.has_project == 'true'
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: 编译全部仪器测试（r3）
        if: steps.detect.outputs.has_project == 'true'
        run: ./gradlew --no-daemon --stacktrace assembleDebugAndroidTest

      - name: 单测结果汇总（r3）
        if: always() && steps.detect.outputs.has_project == 'true'
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in sorted(glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True)):
              r = ET.parse(f).getroot()
              mod = f.split('/build/')[0]
              rows.append((mod, r.get('name'), int(r.get('tests', 0)), int(r.get('failures', 0)) + int(r.get('errors', 0)), int(r.get('skipped', 0))))
          print('| 模块 | 测试类 | 用例 | 失败 | 跳过 |')
          print('|---|---|---|---|---|')
          for m, n, t, fl, s in rows:
              print(f'| {m} | {n} | {t} | {fl} | {s} |')
          print(f'\n合计 {len(rows)} 个测试类，{sum(r[2] for r in rows)} 个用例，失败 {sum(r[3] for r in rows)}，跳过 {sum(r[4] for r in rows)}')
          PY

      - name: 上传单测报告
        if: always() && steps.detect.outputs.has_project == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

      - name: 收集 APK
        if: steps.detect.outputs.has_project == 'true'
        id: apk
        run: |
          mkdir -p out
          SHORT=$(git rev-parse --short HEAD)
          n=0
          while IFS= read -r f; do
            base=$(basename "$f" .apk)
            cp "$f" "out/${base}-${SHORT}.apk"
            n=$((n+1))
          done < <(find . -path '*/build/outputs/apk/debug/*.apk' -not -path './out/*')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: 上传构建产物
        if: steps.detect.outputs.has_project == 'true' && steps.apk.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: pi-go-debug-${{ github.sha }}
          path: out/*.apk
          retention-days: 14

      - name: 发布到 nightly 测试版
        if: >-
          steps.detect.outputs.has_project == 'true' && steps.apk.outputs.count != '0' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=nightly
          NOTES="分支 ${GITHUB_REF_NAME} · 提交 ${GITHUB_SHA} · $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 不移动、不强推标签：nightly 标签首次创建后固定，每次只覆盖资产，
          # 实际对应的分支和提交写在说明和 APK 文件名里。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "pi-go 测试版" --notes "$NOTES" --prerelease
            # 删掉旧资产，再上传新的
            for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$a" -y
            done
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "pi-go 测试版" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" out/*.apk --clobber

  # r3（DESIGN-r3 §8.4 第 3 条）：模拟器仪器测试。只跑已存在的硬性要求测试类。
  # 拆成两个 job：instr-find 找测试类；一个都没有时 instrumented 整个 job 显示为「已跳过」（灰色），
  # 并在汇总里写明「未运行任何仪器测试」，不会显示成绿色的「测试通过」。
  # 生成的 instr.sh 带 set -euo pipefail：任一测试类失败，脚本立即非零退出，job 变红。
  instr-find:
    name: 查找仪器测试类
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.find.outputs.count }}
      classes: ${{ steps.find.outputs.classes }}
    steps:
      - uses: actions/checkout@v4

      - name: 查找已合入的仪器测试类
        id: find
        run: |
          n=0
          classes=""
          for name in UiCoverageTest TermCoverageTest AppCoverageTest FormSwitchStreamingTest; do
            f=$(find . -path '*/src/androidTest/*' -name "$name.kt" -not -path './build/*' | head -1)
            [ -z "$f" ] && { echo "未找到 $name（尚未合入）"; continue; }
            module=$(echo "$f" | sed -e 's#^\./##' -e 's#/src/androidTest/.*##' | tr / :)
            pkg=$(grep -m1 '^package ' "$f" | awk '{print $2}')
            classes="$classes $module=$pkg.$name"
            n=$((n+1))
          done
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "classes=${classes# }" >> "$GITHUB_OUTPUT"
          if [ "$n" = 0 ]; then
            echo "::warning::硬性要求仪器测试类一个都还没合入：模拟器 job 跳过，未运行任何仪器测试（不是测试通过）。"
            echo "### 仪器测试：已跳过" >> "$GITHUB_STEP_SUMMARY"
            echo "未找到 UiCoverageTest / TermCoverageTest / AppCoverageTest / FormSwitchStreamingTest 中的任何一个，**未运行任何仪器测试**。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 仪器测试：将运行 $n 个类" >> "$GITHUB_STEP_SUMMARY"
            for c in $classes; do echo "- \`$c\`" >> "$GITHUB_STEP_SUMMARY"; done
          fi

  instrumented:
    name: 仪器测试（模拟器）
    needs: instr-find
    if: needs.instr-find.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 生成运行脚本（set -euo pipefail）
        env:
          CLASSES: ${{ needs.instr-find.outputs.classes }}
        run: |
          {
            echo 'set -euo pipefail'
            for c in $CLASSES; do
              module=${c%%=*}; cls=${c#*=}
              echo "echo '== $cls =='"
              echo "./gradlew --no-daemon --stacktrace :$module:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=$cls"
            done
          } > "$RUNNER_TEMP/instr.sh"
          cat "$RUNNER_TEMP/instr.sh"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 在模拟器上运行（API 34，x86_64）
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: chmod +x gradlew && bash "$RUNNER_TEMP/instr.sh"
