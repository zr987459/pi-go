name: Android debug build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 检测工程
        id: detect
        run: |
          if [ -f gradlew ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库里还没有 gradlew，跳过构建（等 mvp/scaffold 合入后自动生效）。"
          fi

      - name: 安装 JDK 17
        if: steps.detect.outputs.has_project == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        if: steps.detect.outputs.has_project == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 debug APK
        if: steps.detect.outputs.has_project == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 编译 W3 仪器测试（只编译不运行）
        if: steps.detect.outputs.has_project == 'true'
        run: ./gradlew --no-daemon --stacktrace :core:workspace:assembleDebugAndroidTest :feature:files:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      # ---- r3（DESIGN-r3 §8.4，D3 授权）：全部模块单测 + 全部仪器测试编译 ----
      - name: 单元测试（全部模块，r3）
        if: steps.detect.outputs.has_project == 'true'
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: 编译全部仪器测试（r3）
        if: steps.detect.outputs.has_project == 'true'
        run: ./gradlew --no-daemon --stacktrace assembleDebugAndroidTest

      - name: 上传单测报告（失败时）
        if: failure() && steps.detect.outputs.has_project == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: 收集 APK
        if: steps.detect.outputs.has_project == 'true'
        id: apk
        run: |
          mkdir -p out
          SHORT=$(git rev-parse --short HEAD)
          n=0
          while IFS= read -r f; do
            base=$(basename "$f" .apk)
            cp "$f" "out/${base}-${SHORT}.apk"
            n=$((n+1))
          done < <(find . -path '*/build/outputs/apk/debug/*.apk' -not -path './out/*')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: 上传构建产物
        if: steps.detect.outputs.has_project == 'true' && steps.apk.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: pi-go-debug-${{ github.sha }}
          path: out/*.apk
          retention-days: 14

      - name: 发布到 nightly 测试版
        if: >-
          steps.detect.outputs.has_project == 'true' && steps.apk.outputs.count != '0' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=nightly
          NOTES="分支 ${GITHUB_REF_NAME} · 提交 ${GITHUB_SHA} · $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 不移动、不强推标签：nightly 标签首次创建后固定，每次只覆盖资产，
          # 实际对应的分支和提交写在说明和 APK 文件名里。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "pi-go 测试版" --notes "$NOTES" --prerelease
            # 删掉旧资产，再上传新的
            for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$a" -y
            done
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "pi-go 测试版" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" out/*.apk --clobber

  # r3（DESIGN-r3 §8.4 第 3 条）：模拟器仪器测试。只跑已存在的硬性要求测试类；
  # 一个都还没合入时整个 job 以 notice 结束（不报错），合入后自动生效，缺的类不会让 job 失败。
  instrumented:
    name: 仪器测试（模拟器）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 查找已合入的仪器测试类
        id: find
        run: |
          : > "$RUNNER_TEMP/instr.sh"
          n=0
          for name in UiCoverageTest TermCoverageTest AppCoverageTest FormSwitchStreamingTest; do
            f=$(find . -path '*/src/androidTest/*' -name "$name.kt" -not -path './build/*' | head -1)
            [ -z "$f" ] && { echo "未找到 $name（尚未合入），跳过"; continue; }
            module=$(echo "$f" | sed -e 's#^\./##' -e 's#/src/androidTest/.*##' | tr / :)
            pkg=$(grep -m1 '^package ' "$f" | awk '{print $2}')
            echo "./gradlew --no-daemon --stacktrace :$module:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=$pkg.$name" >> "$RUNNER_TEMP/instr.sh"
            n=$((n+1))
          done
          cat "$RUNNER_TEMP/instr.sh"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" = 0 ]; then echo "::notice::硬性要求仪器测试尚未合入，模拟器步骤跳过。"; fi

      - name: 安装 JDK 17
        if: steps.find.outputs.count != '0'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        if: steps.find.outputs.count != '0'
        uses: gradle/actions/setup-gradle@v4

      - name: 启用 KVM
        if: steps.find.outputs.count != '0'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 在模拟器上运行（API 34，x86_64）
        if: steps.find.outputs.count != '0'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: chmod +x gradlew && bash "$RUNNER_TEMP/instr.sh"
