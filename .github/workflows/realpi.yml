name: 真 pi 桥接集成测试

# r3/core（DESIGN-r3 §8.4、§8.5，D3 授权）：在 CI 上装 pi 1.5.0，跑 realpi/RealPiBridgeIntegrationTest
# （桥接加载、/pigo:tree-nav、/pigo:label、/pigo:reload、生成中发 /pigo:label）。单独成文件，不改 android.yml。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realpi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realpi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 检测桥接测试
        id: detect
        run: |
          if [ -f core/engine/src/test/kotlin/io/github/zr987459/pigo/core/engine/realpi/RealPiBridgeIntegrationTest.kt ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::没有 RealPiBridgeIntegrationTest，跳过。"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.run == 'true'
        with:
          node-version: '22'

      - name: 安装 pi 1.5.0
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pi" && cd "$RUNNER_TEMP/pi"
          echo '{"name":"pi-ci","private":true}' > package.json
          npm i --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.0
          ./node_modules/.bin/pi --version
          echo "PIGO_PI_BIN=$RUNNER_TEMP/pi/node_modules/.bin/pi" >> "$GITHUB_ENV"

      - name: 安装 JDK 17
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        if: steps.detect.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: 运行 RealPiBridgeIntegrationTest
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :core:engine:testDebugUnitTest --tests '*RealPiBridgeIntegrationTest*'
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          fs = glob.glob('core/engine/build/test-results/**/TEST-*RealPiBridgeIntegrationTest*.xml', recursive=True)
          assert fs, '没有生成测试结果'
          r = ET.parse(fs[0]).getroot()
          t, f, s = int(r.get('tests')), int(r.get('failures')) + int(r.get('errors')), int(r.get('skipped'))
          print(f'### 真 pi 桥接集成测试：{t} 个用例，失败 {f}，跳过 {s}')
          for c in r.findall('testcase'):
              st = '跳过' if c.find('skipped') is not None else ('失败' if (c.find('failure') is not None or c.find('error') is not None) else '通过')
              print(f'- {c.get("name")}：{st}')
          assert s == 0, '用例被跳过（PIGO_PI_BIN 未生效）'
          PY

      - name: 上传报告
        if: always() && steps.detect.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: realpi-reports-${{ github.sha }}
          path: |
            core/engine/build/reports/tests/
            core/engine/build/test-results/
          retention-days: 7
